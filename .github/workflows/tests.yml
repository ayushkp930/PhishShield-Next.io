name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q phishshield
      - name: Test Python
        run: python -m pytest -q
      - name: Check frontend syntax
        run: node --check docs/assets/app.js
