services:
  phishshield:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PHISHSHIELD_HOST: 0.0.0.0
      PHISHSHIELD_PORT: 8000
      PHISHSHIELD_DB_PATH: /app/data/phishshield.sqlite3
      PHISHSHIELD_INSPECT_ENABLED: ${PHISHSHIELD_INSPECT_ENABLED:-false}
      PHISHSHIELD_REPUTATION_ENABLED: ${PHISHSHIELD_REPUTATION_ENABLED:-false}
      PHISHSHIELD_WHOIS_ENABLED: ${PHISHSHIELD_WHOIS_ENABLED:-false}
      PHISHSHIELD_REPUTATION_LIMIT: ${PHISHSHIELD_REPUTATION_LIMIT:-6}
      PHISHSHIELD_REPUTATION_WINDOW_SECONDS: ${PHISHSHIELD_REPUTATION_WINDOW_SECONDS:-600}
      PHISHSHIELD_WHOIS_LIMIT: ${PHISHSHIELD_WHOIS_LIMIT:-15}
      PHISHSHIELD_WHOIS_WINDOW_SECONDS: ${PHISHSHIELD_WHOIS_WINDOW_SECONDS:-600}
      PHISHSHIELD_ALLOWED_ORIGINS: ${PHISHSHIELD_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      GOOGLE_WEB_RISK_API_KEY: ${GOOGLE_WEB_RISK_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    volumes:
      - phishshield-data:/app/data
    restart: unless-stopped
volumes:
  phishshield-data:
